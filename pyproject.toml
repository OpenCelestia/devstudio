[project]
name = "anyka-devstudio"
version = "0.1.0"
description = "Anyka DevStudio"
requires-python = ">=3.11"

[project.scripts]
devstudio = "devstudio.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
