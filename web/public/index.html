<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title data-i18n="brand">Celestia Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    grid-template-rows: 44px 1fr;
    grid-template-columns: minmax(540px, 40vw) 14px minmax(400px, 1fr);
    background: #10141c; color: #e8eef6;
    font: 15px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; overflow: hidden;
  }
  #topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    height: 44px; flex-wrap: nowrap; overflow: hidden;
    background: #161b24; border-bottom: 1px solid #2a3344;
  }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #e5484d; flex: none; }
  #dot.on { background: #46c96b; }
  #devname { color: #c5d0de; font-size: 13px; }
  #devHost { width: 11.5em; cursor: text; padding: 4px 8px; font-family: Consolas, monospace; }
  #btnDev { padding: 4px 10px; }
  #langPick { flex: none; padding: 4px 8px; }
  .spacer { flex: 1; }
  #btnLlmPage {
    flex: none; max-width: 22em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #llmPage {
    display: none; position: fixed; z-index: 6;
    left: 0; right: 0; top: 44px; bottom: 0;
    background: #10141c; padding: 24px 32px; overflow: auto;
  }
  #llmPage.on { display: block; }
  .llmHead { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .llmForm { display: flex; flex-direction: column; gap: 12px; max-width: 640px; }
  .llmForm label { display: flex; align-items: center; gap: 12px; }
  .llmForm label span { width: 7.2em; color: #b7c3d4; flex: none; }
  .llmForm select, .llmForm input { flex: 1; min-width: 0; }
  #llmStat { color: #9fb0c3; font-size: 14px; }
  button, select, input, textarea {
    background: #1c2433; color: #e8eef6; border: 1px solid #3a465c;
    border-radius: 6px; padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  textarea { cursor: text; resize: none; }
  button:hover { background: #273246; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.primary:hover { background: #3b76f0; }
  button.on { background: #2563eb; border-color: #2563eb; }
  button:disabled { opacity: .45; cursor: default; }
  #leftCol {
    grid-column: 1; grid-row: 2;
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    align-items: stretch;
  }
  #videoWrap {
    position: relative; background: #000; overflow: hidden;
    flex: 0 0 auto;
    width: 100%;
    aspect-ratio: 5 / 3;
    max-height: calc(100% - 9.2rem);
    min-height: 0;
  }
  #screen {
    position: absolute; inset: 0;
    width: 100%; height: 100%; max-width: none; max-height: none;
    object-fit: contain; object-position: left center;
    cursor: crosshair; touch-action: none;
  }
  #snapHint {
    position: absolute; left: 8px; bottom: 6px; color: #d5deea; font-size: 13px;
    background: rgba(0,0,0,.45); padding: 2px 6px; border-radius: 4px;
  }
  #syncOff {
    display: none; position: absolute; inset: 0;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: #d5deea; background: #10141c;
  }
  #syncOff p { font-size: 16px; }
  #videoWrap.off #screen, #videoWrap.off #snapHint { display: none; }
  #videoWrap.off #syncOff { display: flex; }
  #split {
    grid-column: 2; grid-row: 2;
    background: #070a10;
    border-left: 2px solid #8ea0b8;
    border-right: 2px solid #8ea0b8;
  }
  #right {
    grid-column: 3; grid-row: 2;
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    background: #121820;
  }
  #metrics {
    flex: 1 1 0;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 9.2rem; min-width: 0; overflow: hidden;
    padding: 6px 10px 8px; background: #121820; border-top: 2px solid #8ea0b8;
  }
  #metricSummary {
    flex: none; display: flex; flex-direction: column; gap: 4px;
    font-size: 14px; line-height: 1.4; color: #b7c3d4;
  }
  #metricSummary .metricLine {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px;
    min-width: 0;
  }
  #metricSummary .chip {
    display: flex; align-items: baseline; gap: 6px; flex: 0 0 auto;
    white-space: nowrap;
  }
  #metricSummary .chip[hidden] { display: none; }
  #metricSummary .chip-cpu { flex-direction: row; align-items: baseline; gap: 10px; }
  #metricSummary .cpuRow { display: flex; align-items: baseline; gap: 6px; }
  #metricSummary .chipLab { color: #8ea0b8; font-size: 13px; flex: none; }
  #metricSummary b {
    color: #e8eef6; font-weight: 600; flex: none;
    font: 600 14px/1.4 Consolas, "Cascadia Mono", monospace;
    font-variant-numeric: tabular-nums;
  }
  #metricSummary .chipSub {
    color: #9fb0c3; font-size: 13px; flex: none;
    font: 13px/1.4 Consolas, "Cascadia Mono", monospace;
    font-variant-numeric: tabular-nums;
  }
  #procCol { flex: 1 1 0; min-height: 0; width: 100%; overflow-x: hidden; overflow-y: auto; }
  table.top {
    width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0;
    font: 13px/18px Consolas, "Cascadia Mono", monospace;
  }
  table.top th {
    position: sticky; top: 0; z-index: 1; background: #121820;
    font-size: 13px; font-weight: 600;
    overflow: visible;
    text-overflow: clip;
    padding: 0 5px;
    white-space: nowrap;
    text-align: right;
    color: #b7c3d4;
  }
  table.top td {
    height: 18px; padding: 0 4px;
    overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; text-align: right; color: #d5deea;
  }
  table.top th:first-child, table.top td:first-child,
  table.top th:last-child, table.top td:last-child { text-align: left; }
  table.top .c-name { width: 24%; }
  table.top .c-tid { width: 13%; }
  table.top .c-st { width: 7%; }
  table.top .c-cpu { width: 15%; }
  table.top .c-res { width: 0; }
  table.top .c-tm { width: 15%; }
  table.top td:first-child { max-width: 0; }
  th { color: #b7c3d4; font-weight: 600; border-bottom: 1px solid #2a3344; }
  #logBar { display: flex; gap: 8px; padding: 8px 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid #2a3344; }
  #logBar b { flex: none; font-size: 14px; letter-spacing: .04em; }
  #logFilter { flex: 1; padding: 4px 8px; }
  #log {
    flex: 1; min-height: 0; overflow: auto; padding: 0 12px 8px;
    font: 14px/1.5 Consolas, "Cascadia Mono", monospace; color: #e8eef6;
  }
  #log .logLine {
    display: block; white-space: pre-wrap; word-break: break-all;
  }
  .lv0, .lv7, .tag-kmsg { color: #c5d0de; }
  .lv2 { color: #b7c3d4; }
  .lv3 { color: #e6c36a; }
  .lv4, .lv5 { color: #ff8b8b; }
  .lv6 { color: #e8eef6; }
  .tag-pc { color: #8ec5ff; }
  .tag-serial { color: #9ddeb5; }
  #serPort { width: 5.6em; flex: none; }
  #console {
    flex: 1 1 0; display: flex; flex-direction: column; min-height: 0;
    background: #0e141d;
  }
  #tabs {
    flex: none; display: flex; gap: 8px; padding: 8px 10px; align-items: center;
    background: #161b24; border-bottom: 1px solid #2a3344;
  }
  .pane { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .pane.on { display: flex; }
  .out {
    flex: 1; min-height: 0; overflow: auto; padding: 6px 12px;
    white-space: pre-wrap; word-break: break-all;
    font: 14px/1.45 Consolas, "Cascadia Mono", monospace; color: #e8eef6;
  }
  .cmdline { display: flex; gap: 8px; padding: 8px 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid #2a3344; }
  .cmdline input, .cmdline select { font-family: Consolas, monospace; }
  .cmdline input { flex: 1 1 160px; min-width: 0; }
  .cmdline button { flex: none; }
  .filePanel {
    flex: 0 1 auto; display: flex; flex-direction: column; min-height: 0; max-height: 42vh;
    border-top: 1px solid #2a3344; background: #0e141d;
  }
  #pane-build.editing #buildout { flex: 0 1 26%; min-height: 64px; max-height: 32vh; }
  #pane-build.editing .filePanel { flex: 1 1 auto; max-height: none; min-height: 8em; }
  .fileDir {
    display: none; flex: 0 1 auto; margin: 0 10px 6px; max-height: 22vh; overflow: auto;
    border: 1px solid #2a3344; border-radius: 4px; background: #0c1018;
    font: 13px/1.55 Consolas, "Cascadia Mono", monospace;
  }
  .fileDir.on { display: block; }
  .fileDirHead { padding: 4px 10px; color: #9fb0c3; border-bottom: 1px solid #2a3344; font-size: 12px; }
  .fileDirRow {
    padding: 3px 10px; cursor: pointer; user-select: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fileDirRow:hover { background: #1a2430; }
  .fileDirRow.dir { color: #b7d4ff; }
  .fileDirRow.file { color: #d5deea; }
  .fileDirRow.up { color: #e6c36a; }
  #buildBar.cmdline {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    padding: 8px 10px;
    align-items: center;
    border-top: 1px solid #2a3344;
    overflow-x: auto;
    min-width: 0;
  }
  #buildBar input { flex: 1 1 8em; min-width: 0; width: 100%; }
  #buildBar button { flex: none; padding: 4px 8px; font-size: 13px; white-space: nowrap; }
  button.iconGo {
    width: 34px; height: 34px; padding: 0; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px;
  }
  button.iconGo svg { display: block; pointer-events: none; }
  button.iconGo.busy {
    border-radius: 4px; background: #c4373c; border-color: #c4373c;
  }
  button.iconGo.busy:hover { background: #d84b50; }
  #buildBar button.iconGo, #llmBar button.iconGo { padding: 0; }
  #fileHint { display: none; margin: 0 12px 6px; font-size: 13px; line-height: 1.4; color: #e6c36a; }
  #fileHint.on { display: block; }
  #fileHint.err { color: #ff8b8b; }
  #fileBar {
    display: none; gap: 8px; align-items: center;
    margin: 4px 10px 0; padding: 4px 8px;
    border: 1px solid #2a3344; border-radius: 4px; background: #0c1018;
    font: 13px/1.4 Consolas, "Cascadia Mono", monospace;
  }
  #fileBar.on { display: flex; }
  #fileBar[hidden] { display: none; }
  #filePath { color: #9fb0c3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
  #fileDirty { display: none; color: #e6c36a; flex: none; font-size: 12px; line-height: 1; }
  #fileDirty.on { display: inline; }
  #fileBar .spacer { flex: 0 0 auto; width: 8px; }
  #fileBar button { flex: none; padding: 3px 10px; font-size: 13px; white-space: nowrap; }
  #fileBar button:disabled { opacity: .45; }
  #fileBar[data-mode="dir"] #btnFileRevert, #fileBar[data-mode="dir"] #btnFileSave,
  #fileBar[data-mode="dir"] #fileDirty { display: none; }
  #fileBar:not([data-mode="dir"]) #btnFileUp { display: none; }
  #fileBody {
    display: none; flex: 1 1 120px; min-height: 96px; max-height: 30vh;
    margin: 0 10px 8px; width: calc(100% - 20px); resize: vertical;
    font: 13px/1.45 Consolas, "Cascadia Mono", monospace;
    color: #e8eef6; background: #0c1018; border: 1px solid #2a3344; border-radius: 4px;
    box-sizing: border-box; padding: 6px 8px;
  }
  #pane-build.editing #fileBody.on { max-height: none; min-height: 10em; }
  #fileBody.on { display: block; }
  #llmMode, #llmApp { flex: 0 0 auto; }
  .dock {
    flex: 0 1 auto; display: flex; flex-direction: column; gap: 8px;
    min-height: 0; max-height: 100%; overflow: hidden;
    padding: 8px 10px 10px; border-top: 1px solid #2a3344; background: #121820;
  }
  #llmText {
    flex: none; height: 72px; margin: 0; width: 100%;
    font: 14px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #llmBar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: none; }
  #llmBar .llmBarSpacer { flex: 1; min-width: 8px; }
  #pane-llm { overflow: hidden; }
  #askBox {
    display: flex; flex-direction: column; gap: 8px;
    flex: 1 1 auto; min-height: 0; overflow: hidden;
    padding: 8px; border: 1px solid #3d5a40; border-radius: 6px; background: #152018;
  }
  #askBox[hidden] { display: none; }
  #askTitle { font-weight: 600; flex: none; }
  #askHint, #askErr { margin: 0; flex: none; font-size: 13px; line-height: 1.4; color: #b7c3d4; }
  #askErr:empty { display: none; }
  #askErr { color: #ffb4b4; }
  #askBody {
    flex: 1 1 auto; min-height: 0; overflow: auto;
  }
  #askGo { flex: none; align-self: flex-start; }
  #askBody label.askField, #askBody fieldset {
    display: flex; flex-direction: column; gap: 4px; margin: 0 0 8px; border: 0; padding: 0;
  }
  #askBody input[type="text"], #askBody textarea { width: 100%; box-sizing: border-box; }
  #askBody fieldset label { flex-direction: row; align-items: flex-start; }
  .subhead { color: #b7c3d4; font-size: 13px; padding: 8px 12px 0; }
</style>
</head>
<body>
  <div id="topbar">
    <span id="dot"></span>
    <b data-i18n="brand">Celestia Studio</b>
    <select id="langPick" title="Language">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
    <span id="devname" data-i18n="disconnected">未连接</span>
    <input id="devHost" data-i18n-ph="devHostPh" placeholder="设备 IP" spellcheck="false" autocomplete="off">
    <button id="btnDev" type="button" data-i18n="connect">连接</button>
    <span class="spacer"></span>
    <button id="btnLlmPage" type="button" data-i18n="models">大模型</button>
    <button id="btnSnap" data-i18n="snap">截图</button>
    <button id="btnReboot" data-i18n="reboot">重启设备</button>
    <button id="btnSync" data-i18n="syncClose">关闭同步界面</button>
  </div>

  <div id="llmPage">
    <div class="llmHead">
      <button id="btnLlmBack" type="button" data-i18n="back">返回</button>
      <b data-i18n="models">大模型</b>
      <span id="llmStat" data-i18n="disconnected">未连接</span>
    </div>
    <div class="llmForm">
      <label><span data-i18n="source">来源</span><select id="llmProvider" data-i18n-title="models" title="大模型"></select></label>
      <label id="llmModelRow"><span data-i18n="model">模型</span><select id="llmModel" data-i18n-title="model" title="模型"></select></label>
      <label id="llmCustomRow" hidden><span data-i18n="modelId">模型 ID</span><input id="llmModelCustom" data-i18n-ph="modelIdPh" placeholder="模型 ID" spellcheck="false" autocomplete="off"></label>
      <label id="llmKeyRow"><span data-i18n="key">密钥</span><input id="llmKey" type="password" placeholder="API Key" spellcheck="false" autocomplete="off"></label>
      <label id="llmBaseRow" hidden><span data-i18n="endpoint">接口</span><input id="llmBase" data-i18n-ph="endpointPh" placeholder="接口地址" spellcheck="false" autocomplete="off"></label>
      <div>
        <button id="btnLlmSave" type="button" data-i18n="save">保存</button>
        <button id="btnLlmAuth" type="button" data-i18n="check">验证</button>
      </div>
    </div>
  </div>

  <div id="leftCol">
  <div id="videoWrap">
    <img id="screen" data-i18n-alt="screenAlt" alt="设备画面" draggable="false">
    <span id="snapHint" data-i18n="snapHint">鼠标点按、拖动画面</span>
    <div id="syncOff">
      <p data-i18n="syncOffMsg">同步界面已关闭，可以再次打开</p>
      <button id="btnSyncOpen" type="button" data-i18n="syncOpen">打开同步界面</button>
    </div>
  </div>
  <div id="metrics">
      <div id="metricSummary">
        <div class="metricLine">
          <span class="chip chip-up"><span class="chipLab" data-i18n="uptime">运行</span><b id="mUp">--:--:--</b></span>
          <span class="chip chip-cpu">
            <span class="cpuRow"><span class="chipLab">CPU1:</span><b id="mCpu0">--</b></span>
            <span class="cpuRow"><span class="chipLab">CPU2:</span><b id="mCpu1">--</b></span>
            <span class="cpuRow"><span class="chipLab">负载</span><span class="chipSub" id="mLoad">--</span></span>
          </span>
          <span class="chip chip-temp" id="chipTemp" hidden><span class="chipLab" data-i18n="temp">温度</span><b id="mTemp">--</b></span>
        </div>
        <div class="metricLine">
          <span class="chip chip-mem"><span class="chipLab" data-i18n="memory">内存</span><b id="mMemPct">--</b><span class="chipSub" id="mMemTxt"></span></span>
          <span class="chip chip-net"><span class="chipLab" data-i18n="net">网络</span><b id="mNet">--</b></span>
        </div>
      </div>
      <div id="procCol">
      <table class="top">
        <colgroup>
          <col class="c-name"><col class="c-tid"><col class="c-tid"><col class="c-st"><col class="c-cpu"><col class="c-tm">
        </colgroup>
        <thead><tr><th data-i18n="thread">线程</th><th>TID</th><th>PID</th><th>S</th><th>CPU%</th><th>TIME</th></tr></thead>
        <tbody id="mProcs"></tbody>
      </table>
      </div>
    </div>
  </div>
  <div id="split"></div>

  <div id="right">
    <div id="console">
    <div id="tabs">
      <button class="on" data-pane="build" data-i18n="tabCmd">设备命令</button>
      <button data-pane="llm" data-i18n="tabGen">生成与推送</button>
      <button data-pane="log" data-i18n="logTitle">设备日志</button>
    </div>
    <div class="pane on" id="pane-build">
      <div id="buildout" class="out"></div>
      <div id="filePanel" class="filePanel">
        <div id="fileHint"></div>
        <div id="fileBar" hidden>
          <span id="filePath"></span>
          <span id="fileDirty" data-i18n-title="fileDirtyTip" title="已修改未保存">●</span>
          <span class="spacer"></span>
          <button id="btnFileUp" type="button" data-i18n="fileBack" data-i18n-title="fileBackTip" title="返回上级目录">上一级</button>
          <button id="btnFileRevert" type="button" data-i18n="fileRevert">还原</button>
          <button id="btnFileSave" type="button" data-i18n="fileSave" data-i18n-title="fileSaveTip" title="保存（Ctrl+S）" disabled>保存</button>
          <button id="btnFileClose" type="button" data-i18n="fileClose" data-i18n-title="fileCloseTip" title="关闭（Esc）">关闭</button>
        </div>
        <div id="fileDir" hidden></div>
        <textarea id="fileBody" spellcheck="false" hidden></textarea>
      </div>
      <div class="cmdline" id="buildBar">
        <input id="buildIn" data-i18n-ph="buildInPh" placeholder="命令如 ps | head，或路径如 /etc/config/settings.json" spellcheck="false" autocomplete="off">
        <button id="btnFileRead" type="button" data-i18n="fileOpen">打开</button>
        <button id="btnMntRw" type="button" data-i18n="mntRw" data-i18n-title="mntRwTip" title="mount -o remount,rw /mnt" hidden>挂载可写</button>
        <button id="btnRun" class="iconGo primary" type="button" title="执行" aria-label="执行"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 2.2 3.1 7.3h3.2v6.5h3.4V7.3h3.2L8 2.2z"/></svg></button>
      </div>
    </div>
    <div class="pane" id="pane-llm">
      <div class="subhead" data-i18n="tabRun">执行状态</div>
      <div id="wslout" class="out"></div>
      <div class="dock">
        <div id="llmBar">
          <select id="llmMode">
            <option value="edit" data-i18n="modeEdit">修改APP</option>
            <option value="new" data-i18n="modeNew">新增APP</option>
            <option value="delete" data-i18n="modeDel">删除APP</option>
          </select>
          <select id="llmApp"></select>
          <button id="btnProgressDel" type="button" data-i18n="progressDel" hidden>删除</button>
          <input id="llmNew" data-i18n-ph="newIdPh" placeholder="新应用 id，中文或英文，如 天气 或 weather" spellcheck="false" hidden>
          <button id="btnLlm" class="iconGo primary" type="button" title="执行" aria-label="执行"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 2.2 3.1 7.3h3.2v6.5h3.4V7.3h3.2L8 2.2z"/></svg></button>
          <span class="llmBarSpacer"></span>
          <button id="btnPushAgent" type="button" data-i18n="sysAgent" data-i18n-title="sysAgentTip" title="编译并写入用户区，然后重启设备">同步代理</button>
          <button id="btnPushSetting" type="button" data-i18n="sysSetting" data-i18n-title="sysSettingTip" title="编译并写入用户区，然后重启设备">设置</button>
        </div>
        <textarea id="llmText" data-i18n-ph="llmPh" placeholder="用文字描述要改的行为或新 APP 的界面和功能。修改和新增都会编译，再推到设备。"></textarea>
        <div id="askBox" hidden>
          <div id="askTitle"></div>

  if (d) return `${d}${t('day')}${h}:${String(m).padStart(2, '0')}`;
  return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
};

const THREAD_STORE = 'studioAppThreads';
let appThreads = {};

catch { appThreads = {}; }
let jobThread = '';
let shownThread = null;
function threadKey() {
  const mode = $('llmMode').value;
  if (mode === 'new') {
    const picked = $('llmApp').selectedOptions[0];
    if (picked && picked.dataset.progress === '1' && picked.dataset.id) return 'app:' + picked.dataset.id;
    const id = $('llmNew').value.trim();
    return id ? 'app:' + id : '';
  }
  if (mode === 'delete') return '';
  const opt = $('llmApp').selectedOptions[0];
  const id = (opt && opt.dataset.id) || '';
  return id ? 'app:' + id : '';
}
function saveAppThreads() {
  try { localStorage.setItem(THREAD_STORE, JSON.stringify(appThreads)); }
  catch { /* the browser kept the copy in memory */ }
}
function showAppThread() {
  const key = threadKey();
  if (key === shownThread) return;
  shownThread = key;
  if ($('llmMode').value === 'delete') return;
  $('wslout').textContent = (key && appThreads[key]) || '';
  $('wslout').scrollTop = 1e9;
}
function appendOut(id, text) {
  if (id === 'wslout' && jobThread) {
    appThreads[jobThread] = ((appThreads[jobThread] || '') + text).slice(-100000);
    saveAppThreads();
    if (threadKey() !== jobThread) return;
  }
  const el = $(id);
  el.textContent += text;
  if (el.textContent.length > 200000) el.textContent = el.textContent.slice(-150000);
  el.scrollTop = 1e9;
}

/* ---------- metrics ---------- */
const METRIC_CPU_N = 2;
function metricsCpus(m) {
  if (Array.isArray(m.cpus) && m.cpus.length)
    return m.cpus.map(v => Number(v));
  const one = Number(m.cpu);
  if (!Number.isNaN(one)) return [one];
  return null;
}
function paintCpus(pcts, load) {
  const list = Array.isArray(pcts) ? pcts : [];
  const parts = [];
  for (let i = 0; i < METRIC_CPU_N; i++) {
    const n = list[i];
    const v = n == null || Number.isNaN(Number(n)) ? null : Math.max(0, Math.min(100, Number(n)));
    parts.push(v == null ? '--' : String(Math.round(v)).padStart(2, ' ') + '%');
  }
  $('mCpu0').textContent = parts[0] || '--';
  $('mCpu1').textContent = parts[1] || '--';
  $('mLoad').textContent = load || '';
}
let corePrev = null;
let coreBusy = false;
function parseCoreStat(text) {
  const cores = [];
  for (const line of String(text || '').split('\n')) {
    const m = /^cpu(\d+)\s+(.+)$/.exec(line);
    if (!m) continue;
    const parts = m[2].trim().split(/\s+/).map(Number);
    const total = parts.reduce((a, b) => a + (b || 0), 0);
    const idle = (parts[3] || 0) + (parts[4] || 0);
    cores.push({ total, idle });
  }
  return cores;
}
async function sampleCores(load, fallbackPct) {
  if (coreBusy) {
    if (fallbackPct != null) paintCpus(fallbackPct, load);
    return;
  }
  coreBusy = true;
  try {
    const r = await fetch('/api/exec', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: 'head -n 3 /proc/stat' }),
    });
    const j = await r.json();
    const now = parseCoreStat(j.out || '');
    if (corePrev && now.length && corePrev.length === now.length) {
      paintCpus(now.map((c, i) => {
        const p = corePrev[i];
        const dt = c.total - p.total;
        const di = c.idle - p.idle;
        if (dt <= 0) return 0;
        return Math.max(0, Math.min(100, 100 * (dt - di) / dt));
      }), load);
    } else if (!corePrev) {
      paintCpus(fallbackPct || now.map(() => null), load);
    } else if (fallbackPct) {
      paintCpus(fallbackPct, load);
    }
    corePrev = now;
  } catch {
    if (fallbackPct) paintCpus(fallbackPct, load);
  }
  coreBusy = false;
}
function renderMetrics(m) {
  $('mUp').textContent = fmtUptime(m.uptime || 0);
  const load = m.load ? m.load.map(v => v.toFixed(2)).join('/') : '';
  const cpus = metricsCpus(m);
  const hasCpu = cpus && cpus.length && cpus.some(v => !Number.isNaN(v) && v >= 0);
  if (hasCpu) paintCpus(cpus, load);

function sideOrigin() {

}

async function resolveSyncApiBase(force) {
  if (!force && syncApiBase !== undefined) return syncApiBase;

  for (const p of [location.port, '8081', '8080', '8082']) {
    if (!p) continue;

}

async function toolPost(path, body) {

/* ---------- 编译命令 ---------- */
let sideEvents = null;
function sideStream() {
  if (sideEvents || (location.port === '8081' && location.protocol.startsWith('http'))) return;
  sideEvents = new EventSource('' + sideOrigin() + '/events');
  sideEvents.addEventListener('build', e => appendOut('wslout', JSON.parse(e.data).text + '\n'));
  sideEvents.addEventListener('pane', e => {
    const d = JSON.parse(e.data);
    const id = (d.id === 'wsl' || d.id === 'llm') ? 'wslout' : '';
    if (id) appendOut(id, d.text);
  });
  sideEvents.addEventListener('log', e => {
    const l = JSON.parse(e.data);
    if (l && l.tag === 'serial') appendLog(l);
  });
  sideEvents.addEventListener('job', e => {
    const busy = !!JSON.parse(e.data).busy;
    paintJob(busy);
    if (!busy) loadApps();
  });
  sideEvents.addEventListener('ask', onAsk);
}
async function apiGet(path) {
  if (needSideStream() && typeof sideStream === 'function') sideStream();
  return fetchApi(path, { method: 'GET' });
}
async function refreshSerialPorts() {

  sel.innerHTML = ports.map(p => `<option value="${p}">${p}</option>`).join('');
  if (ports.includes(prev)) sel.value = prev;

}
async function openDeviceSerial(port) {

    method: 'POST', body: JSON.stringify({ port, baud: 115200 }),

}

let tabletApps = [];

  if (lang === 'en' && a.id === 'studio') return 'Celestia Studio';

  if (a.progress) return name + t('appProgress');

  const mode = $('llmMode').value;

  const progressing = mode === 'new' && opt && opt.dataset.progress === '1';
  const hasProgress = tabletApps.some(a => a.progress);

  $('llmNew').hidden = mode !== 'new' || progressing;
  $('llmText').hidden = mode === 'delete';

function fillAppSelect() {
  const mode = $('llmMode').value;

  const list = mode === 'delete'
    ? tabletApps.filter(a => a.added)
    : mode === 'new'
      ? tabletApps.filter(a => a.progress)
      : tabletApps.filter(a => !a.progress);
  const sel = $('llmApp');
  sel.innerHTML = '';
  if (mode === 'new') {
    const fresh = document.createElement('option');
    fresh.value = '';

  }

let llmCatalog = [];
let llmSaved = {};
let llmState = { provider: 'cursor', model: '', baseUrl: '' };
let llmUsing = { provider: 'cursor', model: '', baseUrl: '' };
function currentLlm() {
  return llmCatalog.find(p => p.id === $('llmProvider').value) || null;
}
function chosenModel() {
  const spec = currentLlm();
  if (!spec) return '';
  if (spec.modelFree || $('llmModel').value === '__custom__') return $('llmModelCustom').value.trim();
  return $('llmModel').value;
}
function fillLlmForm() {
  const sel = $('llmProvider');
  const prev = sel.value || llmState.provider || 'cursor';
  sel.innerHTML = '';
  for (const p of llmCatalog) {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = providerLabel(p);
    sel.appendChild(o);
  }
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
  const spec = currentLlm();
  if (!spec) return;
  const models = spec.models || [];
  let want = llmState.provider === spec.id ? llmState.model : '';
  if (!want) want = models[0] || '';
  const modelSel = $('llmModel');
  modelSel.innerHTML = '';
  for (const m of models) {
    const o = document.createElement('option');
    o.value = m;
    o.textContent = (spec.modelLabels && spec.modelLabels[m]) || m || t('pickModel');
    modelSel.appendChild(o);
  }
  if (!spec.modelFree) {
    const custom = document.createElement('option');
    custom.value = '__custom__';
    custom.textContent = t('customModel');
    modelSel.appendChild(custom);
  }
  const useCustom = spec.modelFree || (want !== '' && !models.includes(want));
  $('llmModelRow').hidden = spec.modelFree;
  $('llmCustomRow').hidden = !useCustom;
  if (useCustom) {
    if (!spec.modelFree) modelSel.value = '__custom__';
    $('llmModelCustom').value = want;
  } else {
    modelSel.value = want;
    $('llmModelCustom').value = '';
  }
  $('llmBaseRow').hidden = !spec.baseFree;
  if (spec.baseFree) $('llmBase').value = llmState.baseUrl || '';
  $('llmKey').value = '';
  $('llmKeyRow').hidden = spec.auth === 'login';
  $('llmKey').placeholder = llmSaved[spec.id] ? t('keySaved') : providerHint(spec);
  $('btnLlmAuth').textContent = spec.auth === 'login' ? t('signIn') : t('check');
  showUsing();
}
function modelLabel(spec, id) {
  if (!id) return t('notSelected');
  return (spec && spec.modelLabels && spec.modelLabels[id]) || id;
}
let llmCursorOn = false;
function usingText() {
  const spec = llmCatalog.find(p => p.id === llmUsing.provider);
  const name = spec ? providerLabel(spec) : (llmUsing.provider || t('notSelected'));
  const id = llmUsing.model || (spec && spec.models && spec.models[0]) || '';
  const label = `${name} · ${modelLabel(spec, id)}`;
  const on = spec && spec.auth === 'login' ? llmCursorOn : !!llmSaved[llmUsing.provider];
  return on ? t('linked', { label }) : t('unlinked', { label });
}
function showUsing() {
  const spec = currentLlm();
  const using = usingText();
  const pickedId = spec ? chosenModel() : '';
  const picked = spec ? `${providerLabel(spec)} · ${modelLabel(spec, pickedId)}` : '';
  const savedId = llmUsing.model || (spec && spec.id === llmUsing.provider && spec.models && spec.models[0]) || '';
  const same = spec && spec.id === llmUsing.provider && pickedId === savedId;
  const title = same ? using : t('usingPending', { using, picked });
  $('btnLlmPage').textContent = using;
  $('btnLlmPage').title = title;
  $('llmStat').textContent = using;
  $('llmStat').title = title;
}
function paintLlmLabels() {
  for (const o of $('llmProvider').options) {
    const p = llmCatalog.find(x => x.id === o.value);
    if (p) o.textContent = providerLabel(p);
  }
  const spec = currentLlm();
  for (const o of $('llmModel').options) {
    if (o.value === '__custom__') o.textContent = t('customModel');
    else if (spec) o.textContent = (spec.modelLabels && spec.modelLabels[o.value]) || o.value || t('pickModel');
  }
  if (spec) {
    $('llmKey').placeholder = llmSaved[spec.id] ? t('keySaved') : providerHint(spec);
    $('btnLlmAuth').textContent = spec.auth === 'login' ? t('signIn') : t('check');
  }
  showUsing();
}
$('btnLlmPage').onclick = () => $('llmPage').classList.toggle('on');
$('btnLlmBack').onclick = () => $('llmPage').classList.remove('on');
$('llmProvider').onchange = () => {
  llmState = { provider: $('llmProvider').value, model: '', baseUrl: '' };
  fillLlmForm();

  $('llmModel').onchange = () => {
  $('llmCustomRow').hidden = $('llmModel').value !== '__custom__';
  showUsing();

async function saveLlmForm() {
  const spec = currentLlm();
  if (!spec) throw new Error(t('noProvider'));
  const body = {
    provider: spec.id,
    model: chosenModel(),
    baseUrl: spec.baseFree ? $('llmBase').value.trim() : '',
  };
  const key = $('llmKey').value;
  if (key) body.apiKey = key;
  const r = await toolPost('/api/llm/config', body);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  llmSaved = j.saved || llmSaved;
  llmState = { provider: j.provider, model: j.model || '', baseUrl: j.baseUrl || '' };
  llmUsing = { ...llmState };
  $('llmKey').value = '';
  $('llmKey').placeholder = llmSaved[spec.id] ? t('keySaved') : providerHint(spec);
  return j;
}
async function refreshLlmStatus() {
  const spec = llmCatalog.find(p => p.id === llmUsing.provider);
  if (!spec || spec.auth !== 'login') return;
  try {
    const r = await apiGet('/api/llm/status');
    const j = await r.json();
    llmCursorOn = !!j.ok;
    showUsing();
  } catch { /* 状态查询失败时保留原提示 */ }
}
async function loadLlmUi() {
  try {
    const r = await apiGet('/api/llm/config');
    if (!r.ok) return;
    const j = await r.json();
    llmCatalog = j.providers || [];
    llmSaved = j.saved || {};
    llmState = { provider: j.provider || 'cursor', model: j.model || '', baseUrl: j.baseUrl || '' };
    llmUsing = { ...llmState };
    fillLlmForm();
    refreshLlmStatus();

}
$('btnLlmSave').onclick = async () => {
  $('btnLlmSave').disabled = true;
  try {

  } catch (e) {
    $('llmStat').textContent = String(e.message || e).slice(0, 36);

$('btnLlmAuth').onclick = async () => {
  const spec = currentLlm();
  if (!spec) return;
  $('btnLlmAuth').disabled = true;
  $('llmStat').textContent = spec.auth === 'login' ? t('signingIn') : t('checkingKey');
  try {
    await saveLlmForm();
    const r = await toolPost('/api/llm/login', {});
    const j = await r.json();
    const text = String(j.text || j.error || '').replace(/\s+/g, ' ').trim();
    if (spec.auth === 'login') llmCursorOn = !!j.ok;
    showUsing();

      $('llmStat').textContent = text;
      $('llmStat').title = text;
    } else {
      $('llmStat').title = text ? t('usingNote', { using: usingText(), text }) : usingText();
    }
  } catch (e) {
    $('llmStat').textContent = String(e.message || e).slice(0, 36);
  }
  $('btnLlmAuth').disabled = false;
};
loadLlmUi();

/* ---------- pointer → device ---------- */
let pointing = false;
let lastMove = 0;
let lastPt = null;
function screenPoint(ev) {
  const img = $('screen');
  const r = img.getBoundingClientRect();
  const nw = img.naturalWidth || 800;
  const nh = img.naturalHeight || 480;
  if (!r.width || !r.height) return null;
  const scale = Math.min(r.width / nw, r.height / nh);
  const dw = nw * scale, dh = nh * scale;
  const x = Math.round((ev.clientX - r.left) / scale);
  const y = Math.round((ev.clientY - r.top) / scale);
  if (x < 0 || y < 0 || x >= nw || y >= nh || ev.clientX > r.left + dw || ev.clientY > r.top + dh) return null;
  return { x, y };
}
function sendPtr(op, pt) {
  if (!pt) return;
  const body = JSON.stringify({ op, x: pt.x, y: pt.y });
  fetch('/api/input', { method: 'POST', body }).then(r => {
    if (r.status === 404)
      fetch('' + sideOrigin() + '/api/input', { method: 'POST', mode: 'no-cors', body });
  }).catch(() => {});
}
$('screen').addEventListener('pointerdown', ev => {
  const pt = screenPoint(ev);
  if (!pt) return;
  pointing = true;
  lastPt = pt;
  $('screen').setPointerCapture(ev.pointerId);
  sendPtr('down', pt);
});
$('screen').addEventListener('pointermove', ev => {
  if (!pointing) return;
  const pt = screenPoint(ev);
  if (!pt) return;
  lastPt = pt;
  const now = performance.now();
  if (now - lastMove < 30) return;
  lastMove = now;
  sendPtr('move', pt);
});
$('screen').addEventListener('pointerup', ev => {
  if (!pointing) return;
  pointing = false;
  sendPtr('up', screenPoint(ev) || lastPt);
});
$('screen').addEventListener('pointercancel', () => {
  if (!pointing) return;
  pointing = false;
  sendPtr('up', lastPt);
});

$('screen').src = '/video?' + Date.now();
$('screen').onerror = () => {
  if (!syncOn) return;
  setTimeout(() => { if (syncOn) $('screen').src = '/video?' + Date.now(); }, 3000);
};
